<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#9c6f12"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- beveled retro card border -->
  <rect x="8" y="8" width="112" height="112" rx="16" fill="url(#frame)" stroke="#6b4e12" stroke-width="2"/>
  <rect x="19" y="19" width="90" height="90" rx="11" fill="none" stroke="#f6e3a0" stroke-width="2" opacity="0.7"/>

  <!-- recessed art window -->
  <rect x="30" y="30" width="68" height="68" rx="8" fill="url(#window)" stroke="#6b4e12" stroke-width="2"/>

  <!-- retro-frame highlight star -->
  <path d="M64 41 L69.5 56.6 L86 57 L72.8 67.1 L77.6 82.8 L64 73.4 L50.4 82.8 L55.2 67.1 L42 57 L58.5 56.6 Z"
        fill="#f0c64b" stroke="#9c6f12" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
