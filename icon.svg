<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cf8f"/>
      <stop offset="0.5" stop-color="#c9a64e"/>
      <stop offset="1" stop-color="#8f7029"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e3b0"/>
      <stop offset="1" stop-color="#c2a256"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30302e"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <!-- card body (retro tan border) -->
  <rect x="20" y="5" width="88" height="118" rx="9" fill="url(#border)" stroke="#574213" stroke-width="2"/>
  <rect x="24.5" y="9.5" width="79" height="109" rx="6" fill="none" stroke="#f6e8b8" stroke-width="1.6" opacity="0.6"/>

  <!-- title bar -->
  <rect x="28" y="11" width="72" height="13" rx="3" fill="url(#bar)" stroke="#574213" stroke-width="1.2"/>

  <!-- art window with the retro-frame highlight star -->
  <rect x="28" y="28" width="72" height="44" rx="2.5" fill="url(#art)" stroke="#574213" stroke-width="1.6"/>
  <path d="M64 33 L68 44.5 L80.17 44.75 L70.47 52.1 L73.99 63.75 L64 56.8 L54.01 63.75 L57.53 52.1 L47.83 44.75 L60 44.5 Z"
        fill="#f0c64b" stroke="#8f6f1e" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- type line -->
  <rect x="28" y="76" width="72" height="10" rx="2.5" fill="url(#bar)" stroke="#574213" stroke-width="1.2"/>

  <!-- text box -->
  <rect x="28" y="89" width="72" height="29" rx="2.5" fill="#ece0b4" stroke="#574213" stroke-width="1.2"/>
  <line x1="33" y1="96" x2="95" y2="96" stroke="#b59a5b" stroke-width="2.4"/>
  <line x1="33" y1="104" x2="95" y2="104" stroke="#b59a5b" stroke-width="2.4"/>
  <line x1="33" y1="112" x2="78" y2="112" stroke="#b59a5b" stroke-width="2.4"/>
</svg>
